<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestão da Igreja</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="login" class="login hidden">
    <form id="loginForm" class="card login-card">
      <h1>✝ Gestão da Igreja</h1>
      <label>E-mail<input name="email" type="email" required autocomplete="username"></label>
      <label>Senha<input name="password" type="password" required autocomplete="current-password"></label>
      <p id="loginError" class="error"></p>
      <button class="btn primary" type="submit">Entrar</button>
    </form>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand">✝ Gestão da Igreja</div>
      <nav id="nav"></nav>
      <div class="user">
        <div id="userName"></div>
        <small id="userRole"></small>
        <button id="chpw" class="btn small">Trocar senha</button> <button id="logout" class="btn small">Sair</button>
      </div>
    </aside>
    <main>
      <header class="topbar"><button id="menuBtn" class="btn small menu-btn">☰</button><h2 id="title"></h2></header>
      <section id="view"></section>
    </main>
  </div>

  <dialog id="modal"><div id="modalBody"></div></dialog>
  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
